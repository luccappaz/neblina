[workspace]
members = ["crates/neblina", "crates/neblina-wm", "crates/neblina-anfis", "crates/insulina"]
resolver = "2"

[workspace.package]
version = "0.3.0"
edition = "2024"
authors = ["Lucca da Paz <luccagpaz@gmail.com>"]
description = "Neblina is a fuzzy operational library."
license = "MIT"
repository = "https://github.com/luccappaz/neblina"
readme = "README.md"
keywords = ["fuzzy-logic", "machine-learning", "wang-mendel", "ai", "inference"]
categories = ["science", "mathematics", "algorithms"]

[workspace.dependencies]
plotters = "0.3.7"
polars = {version = "0.55.2", features = ["lazy"]}
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
tempfile = "3.27.0"
thiserror = "2.0.20"
